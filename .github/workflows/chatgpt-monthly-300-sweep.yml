name: Monthly 300 dollar contribution target sweep

on:
  push:
    branches:
      - chatgpt-monthly-300-target-sweep
    paths:
      - chatgpt_backtest/research_monthly_300_target_sweep.py
      - .github/workflows/chatgpt-monthly-300-sweep.yml

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out monthly contribution branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-monthly-300-target-sweep

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download BTC history
        run: |
          curl -L --fail --retry 5 --retry-delay 5 \
            -o /tmp/btcusd_bitstamp_1min_2012-2025.csv.gz \
            https://raw.githubusercontent.com/ff137/bitstamp-btcusd-minute-data/main/data/historical/btcusd_bitstamp_1min_2012-2025.csv.gz

      - name: Download and normalize one-year equity samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/equities /tmp/zips
          download_one() {
            local kind="$1" ticker="$2"
            local zip="/tmp/zips/${ticker}.zip"
            local output="/tmp/equities/${kind}_${ticker}.csv"
            curl -L --fail --retry 5 --retry-delay 3 --max-time 180 \
              "https://frd001.s3-us-east-2.amazonaws.com/${ticker}_1min_sample_firstratedata.zip" \
              -o "$zip"
            local member
            member="$(unzip -Z1 "$zip" | grep -Ei '\.(txt|csv)$' | head -n 1)"
            test -n "$member"
            unzip -p "$zip" "$member" > "$output"
            sed -i '1s/^timestamp/datetime/' "$output"
            test "$(wc -l < "$output")" -gt 1000
          }
          for ticker in AAPL AMZN MSFT META TSLA; do download_one stock "$ticker"; done
          for ticker in SPY QQQ DIA; do download_one etf "$ticker"; done

      - name: Run monthly contribution sweep
        run: |
          rm -rf chatgpt_backtest/results_monthly_300_target_sweep
          python chatgpt_backtest/research_monthly_300_target_sweep.py \
            --btc /tmp/btcusd_bitstamp_1min_2012-2025.csv.gz \
            --equities /tmp/equities \
            --output chatgpt_backtest/results_monthly_300_target_sweep

      - name: Commit result tables
        run: |
          git config user.name "chatgpt-backtest"
          git config user.email "chatgpt-backtest@users.noreply.github.com"
          git add chatgpt_backtest/results_monthly_300_target_sweep
          if ! git diff --cached --quiet; then
            git commit -m "Add monthly 300 dollar contribution results [skip ci]"
            git push origin HEAD:chatgpt-monthly-300-target-sweep
          fi
