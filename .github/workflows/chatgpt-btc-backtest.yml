name: Temporary BTC minute-strategy backtest

on:
  push:
    branches:
      - chatgpt-btc-minute-backtest
    paths:
      - chatgpt_backtest/btc_minute_backtest.py
      - chatgpt_backtest/btc_minute_backtest_7day_exit.py
      - .github/workflows/chatgpt-btc-backtest.yml

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-btc-minute-backtest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download public Bitstamp BTC/USD minute data
        run: |
          curl -L --fail --retry 5 --retry-delay 5 \
            -o /tmp/btcusd_bitstamp_1min_2012-2025.csv.gz \
            https://raw.githubusercontent.com/ff137/bitstamp-btcusd-minute-data/main/data/historical/btcusd_bitstamp_1min_2012-2025.csv.gz
          ls -lh /tmp/btcusd_bitstamp_1min_2012-2025.csv.gz

      - name: Run seven-day forced-exit backtest
        run: |
          python chatgpt_backtest/btc_minute_backtest_7day_exit.py \
            /tmp/btcusd_bitstamp_1min_2012-2025.csv.gz

      - name: Commit result tables to the temporary branch
        run: |
          git config user.name "chatgpt-backtest"
          git config user.email "chatgpt-backtest@users.noreply.github.com"
          git add chatgpt_backtest/results_7day_exit
          if ! git diff --cached --quiet; then
            git commit -m "Add seven-day forced-exit BTC results [skip ci]"
            git push origin HEAD:chatgpt-btc-minute-backtest
          fi
