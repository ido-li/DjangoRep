name: Target sweep 1 through 10 percent

on:
  push:
    branches:
      - chatgpt-cross-asset-firstrate
    paths:
      - .github/workflows/chatgpt-btc-backtest.yml

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-cross-asset-firstrate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download BTC history
        run: |
          curl -L --fail --retry 5 --retry-delay 5 \
            -o /tmp/btcusd_bitstamp_1min_2012-2025.csv.gz \
            https://raw.githubusercontent.com/ff137/bitstamp-btcusd-minute-data/main/data/historical/btcusd_bitstamp_1min_2012-2025.csv.gz

      - name: Download and normalize fixed one-year samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/equities /tmp/zips
          download_one() {
            local kind="$1" ticker="$2"
            local zip="/tmp/zips/${ticker}.zip"
            local output="/tmp/equities/${kind}_${ticker}.csv"
            curl -L --fail --retry 5 --retry-delay 3 --max-time 180 \
              "https://frd001.s3-us-east-2.amazonaws.com/${ticker}_1min_sample_firstratedata.zip" \
              -o "$zip"
            local member
            member="$(unzip -Z1 "$zip" | grep -Ei '\.(txt|csv)$' | head -n 1)"
            unzip -p "$zip" "$member" > "$output"
            sed -i '1s/^timestamp/datetime/' "$output"
            test "$(wc -l < "$output")" -gt 1000
          }
          for ticker in AAPL AMZN MSFT META TSLA; do download_one stock "$ticker"; done
          for ticker in SPY QQQ DIA; do download_one etf "$ticker"; done

      - name: Convert backtester into a 1 to 10 percent sweep
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("chatgpt_backtest/research_2pct_cross_asset.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              ('EQUITY_START_DATE = "2025-08-29"', 'EQUITY_START_DATE = "2022-09-30"'),
              ('EQUITY_END_DATE_EXCLUSIVE = "2026-08-29"', 'EQUITY_END_DATE_EXCLUSIVE = "2023-10-01"'),
              ('RTH_END = time(16, 0)', 'RTH_END = time(16, 0)\nTARGET_RATES = [i / 100.0 for i in range(1, 11)]'),
              ('btc_results, btc_benchmark = run_stream(iter_btc(args.btc), [0.02])', 'btc_results, btc_benchmark = run_stream(iter_btc(args.btc), TARGET_RATES)'),
              ('"strategies": [btc_results[0.02]],', '"strategies": [btc_results[rate] for rate in TARGET_RATES],'),
              ('target_results, benchmark = run_stream(iter_equity(path), [0.01, 0.02])', 'target_results, benchmark = run_stream(iter_equity(path), TARGET_RATES)'),
              ('"strategies": [target_results[0.01], target_results[0.02]],', '"strategies": [target_results[rate] for rate in TARGET_RATES],'),
              ('for rate in [0.01, 0.02]:', 'for rate in TARGET_RATES:'),
              ('"btc_five_year_2pct": btc_output,', '"btc_five_year_target_sweep_1_10": btc_output,'),
              ('args.output / "btc_2pct_result.csv",\n        [{**btc_benchmark, **btc_results[0.02]}],', 'args.output / "btc_target_sweep_1_10.csv",\n        [{**btc_benchmark, **btc_results[rate]} for rate in TARGET_RATES],'),
          ]

          for old, new in replacements:
              if old not in text:
                  raise RuntimeError(f"Expected source fragment not found: {old}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Run target sweep
        run: |
          rm -rf chatgpt_backtest/results_target_sweep_1_10
          python chatgpt_backtest/research_2pct_cross_asset.py \
            --btc /tmp/btcusd_bitstamp_1min_2012-2025.csv.gz \
            --equities /tmp/equities \
            --output chatgpt_backtest/results_target_sweep_1_10

      - name: Commit sweep results only
        run: |
          git checkout -- chatgpt_backtest/research_2pct_cross_asset.py
          git config user.name "chatgpt-backtest"
          git config user.email "chatgpt-backtest@users.noreply.github.com"
          git add chatgpt_backtest/results_target_sweep_1_10
          if ! git diff --cached --quiet; then
            git commit -m "Add 1 to 10 percent target sweep results [skip ci]"
            git push origin HEAD:chatgpt-cross-asset-firstrate
          fi
