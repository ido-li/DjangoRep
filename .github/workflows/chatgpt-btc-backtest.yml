name: Temporary trading-strategy backtests

on:
  push:
    branches:
      - chatgpt-btc-minute-backtest
    paths:
      - chatgpt_backtest/research_2pct_cross_asset.py
      - .github/workflows/chatgpt-btc-backtest.yml

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-btc-minute-backtest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download public Bitstamp BTC/USD minute data
        run: |
          curl -L --fail --retry 5 --retry-delay 5 \
            -o /tmp/btcusd_bitstamp_1min_2012-2025.csv.gz \
            https://raw.githubusercontent.com/ff137/bitstamp-btcusd-minute-data/main/data/historical/btcusd_bitstamp_1min_2012-2025.csv.gz
          ls -lh /tmp/btcusd_bitstamp_1min_2012-2025.csv.gz

      - name: Download one year of U.S. one-minute bars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/equities

          download_one() {
            local asset="$1"
            local ticker="$2"
            local output="/tmp/equities/${asset}_${ticker}.csv"
            echo "Downloading ${asset} ${ticker}"
            curl --get --fail --location --compressed --retry 5 --retry-delay 3 \
              --data-urlencode "timeframe=1min" \
              --data-urlencode "adjustment=adj_split" \
              --data-urlencode "start=2025-08-29 00:00:00" \
              --data-urlencode "end=2026-08-29 00:00:00" \
              --data-urlencode "order=asc" \
              --data-urlencode "limit=500000" \
              --data-urlencode "format=csv" \
              "https://www.hfmarketdata.io/v1/bars/${asset}/${ticker}" \
              -o "$output"
            test "$(wc -l < "$output")" -gt 1000
            head -n 2 "$output"
          }

          for ticker in AAPL MSFT NVDA TSLA AMZN META JPM XOM; do
            download_one stock "$ticker"
          done
          for ticker in SPY QQQ DIA IWM; do
            download_one etf "$ticker"
          done

          du -h /tmp/equities/*.csv

      - name: Run BTC 2 percent and cross-asset one-year backtests
        run: |
          rm -rf chatgpt_backtest/results_cross_asset_2pct
          python chatgpt_backtest/research_2pct_cross_asset.py \
            --btc /tmp/btcusd_bitstamp_1min_2012-2025.csv.gz \
            --equities /tmp/equities \
            --output chatgpt_backtest/results_cross_asset_2pct

      - name: Commit result tables to the temporary branch
        run: |
          git config user.name "chatgpt-backtest"
          git config user.email "chatgpt-backtest@users.noreply.github.com"
          git add chatgpt_backtest/results_cross_asset_2pct
          if ! git diff --cached --quiet; then
            git commit -m "Add 2 percent and one-year cross-asset results [skip ci]"
            git push origin HEAD:chatgpt-btc-minute-backtest
          fi
