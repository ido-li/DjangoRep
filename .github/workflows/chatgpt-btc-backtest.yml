name: Chunked current one-year cross-asset backtest

on:
  push:
    branches:
      - chatgpt-cross-asset-chunked
    paths:
      - .github/workflows/chatgpt-btc-backtest.yml

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out chunked branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-cross-asset-chunked

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download BTC history
        run: |
          curl -L --fail --retry 5 --retry-delay 5 \
            -o /tmp/btcusd_bitstamp_1min_2012-2025.csv.gz \
            https://raw.githubusercontent.com/ff137/bitstamp-btcusd-minute-data/main/data/historical/btcusd_bitstamp_1min_2012-2025.csv.gz

      - name: Download current minute bars in monthly chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/equities /tmp/parts
          ranges=(
            '2025-08-29 00:00:00|2025-09-01 00:00:00'
            '2025-09-01 00:00:00|2025-10-01 00:00:00'
            '2025-10-01 00:00:00|2025-11-01 00:00:00'
            '2025-11-01 00:00:00|2025-12-01 00:00:00'
            '2025-12-01 00:00:00|2026-01-01 00:00:00'
            '2026-01-01 00:00:00|2026-02-01 00:00:00'
            '2026-02-01 00:00:00|2026-03-01 00:00:00'
            '2026-03-01 00:00:00|2026-04-01 00:00:00'
            '2026-04-01 00:00:00|2026-05-01 00:00:00'
            '2026-05-01 00:00:00|2026-06-01 00:00:00'
            '2026-06-01 00:00:00|2026-07-01 00:00:00'
            '2026-07-01 00:00:00|2026-08-01 00:00:00'
            '2026-08-01 00:00:00|2026-08-29 00:00:00'
          )

          download_ticker() {
            local asset="$1" ticker="$2"
            local output="/tmp/equities/${asset}_${ticker}.csv"
            : > "$output"
            local first=1 i=0
            for range in "${ranges[@]}"; do
              local start="${range%%|*}" end="${range#*|}"
              local part="/tmp/parts/${ticker}_${i}.csv"
              curl --get --fail --location --compressed --retry 4 --retry-delay 2 --max-time 180 \
                --data-urlencode "timeframe=1min" \
                --data-urlencode "adjustment=adj_split" \
                --data-urlencode "start=${start}" \
                --data-urlencode "end=${end}" \
                --data-urlencode "order=asc" \
                --data-urlencode "limit=100000" \
                --data-urlencode "format=csv" \
                "https://www.hfmarketdata.io/v1/bars/${asset}/${ticker}" \
                -o "$part"
              if [ "$first" -eq 1 ]; then
                cat "$part" >> "$output"
                first=0
              else
                tail -n +2 "$part" >> "$output"
              fi
              i=$((i+1))
            done
            test "$(wc -l < "$output")" -gt 1000
            echo "Finished ${ticker}: $(wc -l < "$output") rows"
          }
          export -f download_ticker
          export ranges

          download_ticker stock AAPL &
          download_ticker stock MSFT &
          download_ticker stock NVDA &
          download_ticker stock TSLA &
          download_ticker stock AMZN &
          download_ticker stock META &
          wait
          download_ticker stock JPM &
          download_ticker stock XOM &
          download_ticker etf SPY &
          download_ticker etf QQQ &
          download_ticker etf DIA &
          download_ticker etf IWM &
          wait
          head -n 2 /tmp/equities/stock_AAPL.csv
          du -h /tmp/equities/*.csv

      - name: Run the backtests
        run: |
          rm -rf chatgpt_backtest/results_cross_asset_2pct
          python chatgpt_backtest/research_2pct_cross_asset.py \
            --btc /tmp/btcusd_bitstamp_1min_2012-2025.csv.gz \
            --equities /tmp/equities \
            --output chatgpt_backtest/results_cross_asset_2pct

      - name: Commit result tables
        run: |
          git config user.name "chatgpt-backtest"
          git config user.email "chatgpt-backtest@users.noreply.github.com"
          git add chatgpt_backtest/results_cross_asset_2pct
          if ! git diff --cached --quiet; then
            git commit -m "Add chunked current one-year results [skip ci]"
            git push origin HEAD:chatgpt-cross-asset-chunked
          fi
